<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>이차곡선 방정식 유도 마스터</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            startup: { pageReady: () => { return MathJax.startup.defaultPageReady().then(() => { initProblem(); }); } }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Noto Sans KR', sans-serif; 
            background-color: #fff5f8;
            background-image: radial-gradient(#fbcfe8 1px, transparent 1px);
            background-size: 20px 20px;
            color: #475569;
        }
        .hero-bg { background: linear-gradient(135deg, #fdf4ff 0%, #fce7f3 50%, #e0e7ff 100%); position: relative; overflow: hidden; border-bottom: 1px solid white; }
        .blob { position: absolute; filter: blur(40px); z-index: 0; opacity: 0.6; animation: float 8s ease-in-out infinite; }
        .blob-1 { background: #fbcfe8; width: 300px; height: 300px; border-radius: 50%; top: -50px; left: -100px; animation-delay: 0s; }
        .blob-2 { background: #c7d2fe; width: 250px; height: 250px; border-radius: 50%; bottom: -80px; right: -50px; animation-delay: -3s; }
        .blob-3 { background: #e9d5ff; width: 200px; height: 200px; border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%, -50%); animation-delay: -5s; }
        @keyframes float { 0% { transform: translate(0, 0) scale(1); } 33% { transform: translate(20px, -30px) scale(1.05); } 66% { transform: translate(-20px, 20px) scale(0.95); } 100% { transform: translate(0, 0) scale(1); } }
        
        .glass-card { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.8); box-shadow: 0 10px 25px -5px rgba(244, 114, 182, 0.15); }
        .highlight { position: relative; display: inline-block; z-index: 1; }
        .highlight::after { content: ''; position: absolute; bottom: 2px; left: -2px; right: -2px; height: 10px; background-color: #fce7f3; z-index: -1; border-radius: 4px; }

        .tab-btn { flex: 1; padding: 12px; font-size: 16px; font-weight: bold; border: 2px solid transparent; border-radius: 12px; background-color: rgba(255,255,255,0.5); color: #64748b; cursor: pointer; transition: all 0.2s; min-width: 100px; }
        .tab-btn.active { background-color: white; border-color: #fbcfe8; color: #db2777; box-shadow: 0 4px 6px rgba(244, 114, 182, 0.1); }
        
        .step-card { background: rgba(255,255,255,0.8); border: 1px solid #fce7f3; padding: 15px; border-radius: 16px; margin-bottom: 15px; box-shadow: 0 2px 4px rgba(244,114,182,0.05); }
        .step-title { font-size: 0.95rem; color: #db2777; font-weight: bold; margin-bottom: 10px; }
        
        input[type="number"] { padding: 10px; font-size: 16px; border: 2px solid #fce7f3; border-radius: 8px; width: 80px; text-align: center; box-sizing: border-box; font-family: inherit; color: #475569; font-weight: bold; }
        input[type="number"]:focus { outline: none; border-color: #f472b6; box-shadow: 0 0 0 3px rgba(244, 114, 182, 0.2); }
        .eq-input { width: 70px !important; }
        
        .result-msg { display: inline-block; margin-left: 10px; font-weight: bold; font-size: 14px; }
        .correct-text { color: #10b981; } .incorrect-text { color: #f43f5e; }
        
        .fraction { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; padding: 0 4px; }
        .fraction .num { border-bottom: 2px solid #475569; padding-bottom: 2px; width: 100%; text-align: center; }
        .fraction .den { padding-top: 2px; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center">

    <header class="hero-bg w-full py-12 px-4 text-center shadow-sm relative mb-8">
        <div class="blob blob-1"></div><div class="blob blob-2"></div><div class="blob blob-3"></div>
        <div class="max-w-4xl mx-auto relative z-10">
            <div class="inline-block bg-white/80 text-pink-500 text-xs font-bold px-4 py-1.5 rounded-full mb-4 shadow-sm border border-pink-100">
                ✨ 단계별 빌드업 연습
            </div>
            <h1 class="text-3xl md:text-4xl font-black text-slate-700 mb-3 tracking-tight">이차곡선 방정식 유도 <span class="highlight text-pink-500">마스터</span> 🎀</h1>
        </div>
    </header>

    <div class="w-full max-w-2xl px-4 relative z-10 mb-12">
        <div class="glass-card rounded-3xl p-6">
            
            <div class="flex gap-2 mb-6 flex-wrap">
                <button class="tab-btn active" onclick="changeType('parabola')">🌸 포물선 연습</button>
                <button class="tab-btn" onclick="changeType('ellipse')">🦋 타원 연습</button>
                <button class="tab-btn" onclick="changeType('hyperbola')">🔮 쌍곡선 연습</button>
            </div>

            <div class="bg-white/60 p-5 rounded-xl border border-pink-100 font-bold text-lg text-slate-700 mb-6 text-center shadow-sm" id="problem-text">
                문제를 생성하는 중입니다...
            </div>

            <div class="step-card" id="step1-card">
                <div class="step-title" id="step1-title">1단계: 초점의 좌표에서 상수 $c$의 값 구하기</div>
                <div class="flex items-center gap-2 flex-wrap">
                    <label id="step1_label" class="font-bold text-slate-600">$c =$ </label>
                    <input type="number" id="step1_ans" placeholder="값">
                    <span id="step1_res" class="result-msg"></span>
                </div>
            </div>

            <div class="step-card" id="step2-card">
                <div class="step-title" id="step2-title">2단계: 거리의 합을 이용하여 $a^2$ 값 구하기</div>
                <div class="flex items-center gap-2 flex-wrap">
                    <label id="step2_label" class="font-bold text-slate-600">$a^2 =$ </label>
                    <input type="number" id="step2_ans" placeholder="값">
                    <span id="step2_res" class="result-msg"></span>
                </div>
            </div>

            <div class="step-card" id="step3-card">
                <div class="step-title" id="step3-title">3단계: 관계식을 이용하여 $b^2$의 값 구하기</div>
                <div class="flex items-center gap-2 flex-wrap">
                    <label id="step3_label" class="font-bold text-slate-600">$b^2 =$ </label>
                    <input type="number" id="step3_ans" placeholder="값">
                    <span id="step3_res" class="result-msg"></span>
                </div>
            </div>

            <div class="step-card" id="step4-card">
                <div class="step-title">최종 방정식 완성하기</div>
                <div class="flex items-center gap-2 flex-wrap justify-center bg-white p-4 rounded-xl border border-pink-50" id="step4-inputs">
                    <!-- JS Rendering -->
                </div>
                <div id="step4_res" class="result-msg" style="display:block; width:100%; text-align:center; margin-top:10px;"></div>
            </div>

            <div class="flex flex-col sm:flex-row gap-3 mt-6">
                <button class="flex-1 py-3 bg-slate-700 hover:bg-slate-800 text-white font-bold rounded-xl shadow-md transition transform active:scale-95" onclick="checkSteps()">정답 확인 및 채점</button>
                <button class="flex-1 py-3 bg-pink-400 hover:bg-pink-500 text-white font-bold rounded-xl shadow-md transition transform active:scale-95" onclick="initProblem()">새로운 동형 문제 생성</button>
            </div>
        </div>
    </div>

    <script>
        let currentType = 'parabola';
        let probData = {};

        function getRandomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

        function changeType(type) {
            currentType = type;
            const btns = document.querySelectorAll('.tab-btn');
            btns.forEach(btn => btn.classList.remove('active'));
            if(type === 'parabola') btns[0].classList.add('active');
            else if(type === 'ellipse') btns[1].classList.add('active');
            else btns[2].classList.add('active');
            initProblem();
        }

        function initProblem() {
            document.querySelectorAll('input').forEach(input => input.value = '');
            document.querySelectorAll('.result-msg').forEach(msg => msg.innerHTML = '');
            let axis = Math.random() > 0.5 ? 'x' : 'y'; 
            let set = [ [3,4,5], [4,3,5], [6,8,10], [8,6,10], [5,12,13], [12,5,13], [8,15,17], [15,8,17] ];
            let picked = set[getRandomInt(0, set.length - 1)]; let leg1 = picked[0]; let leg2 = picked[1]; let hyp = picked[2];
            
            if (currentType === 'parabola') {
                let p = getRandomInt(-6, 6); if (p === 0) p = 2;
                probData = { type: 'parabola', axis: axis, p: p };
                if (axis === 'x') probData.text = `초점 $F(${p}, 0)$과 준선 $x = ${-p}$로부터 거리가 같은 점들의 자취(포물선)의 방정식을 구하시오.`;
                else probData.text = `초점 $F(0, ${p})$과 준선 $y = ${-p}$로부터 거리가 같은 점들의 자취(포물선)의 방정식을 구하시오.`;

                document.getElementById('step1-title').innerHTML = "1단계: 초점의 좌표에서 상수 $p$의 값 구하기";
                document.getElementById('step1_label').innerHTML = "$p =$ ";
                document.getElementById('step2-title').innerHTML = "2단계: 포물선의 방정식 계수 $4p$의 값 구하기";
                document.getElementById('step2_label').innerHTML = "$4p =$ ";
                document.getElementById('step3-card').style.display = 'none';

                if (axis === 'x') document.getElementById('step4-inputs').innerHTML = `<span style="font-size:20px; font-weight:bold; margin-right: 5px;">$y^2 =$</span><input type="number" id="step4_A" class="eq-input" placeholder="계수"><span style="font-size:20px; font-weight:bold; margin-left: 5px;">$x$</span>`;
                else document.getElementById('step4-inputs').innerHTML = `<span style="font-size:20px; font-weight:bold; margin-right: 5px;">$x^2 =$</span><input type="number" id="step4_A" class="eq-input" placeholder="계수"><span style="font-size:20px; font-weight:bold; margin-left: 5px;">$y$</span>`;
                
            } else if (currentType === 'ellipse') {
                document.getElementById('step3-card').style.display = 'block';
                let c = leg1;
                if(axis === 'x') {
                    let a = hyp; let b = leg2; probData = { type: 'ellipse', axis: 'x', c: c, aSq: a*a, bSq: b*b, text: `두 초점 $F(${c}, 0)$, $F'(-${c}, 0)$로부터의 거리의 합이 $${2*a}$인 타원의 방정식을 구하시오.` };
                    document.getElementById('step1-title').innerHTML = "1단계: 초점의 좌표에서 상수 $c$의 값 구하기";
                    document.getElementById('step2-title').innerHTML = "2단계: 거리의 합($2a$)을 이용하여 $a^2$ 값 구하기";
                    document.getElementById('step3-title').innerHTML = "3단계: 관계식($b^2 = a^2 - c^2$)을 이용하여 $b^2$의 값 구하기";
                } else {
                    let b = hyp; let a = leg2; probData = { type: 'ellipse', axis: 'y', c: c, aSq: a*a, bSq: b*b, text: `두 초점 $F(0, ${c})$, $F'(0, -${c})$로부터의 거리의 합이 $${2*b}$인 타원의 방정식을 구하시오.` };
                    document.getElementById('step1-title').innerHTML = "1단계: 초점의 좌표에서 상수 $c$의 값 구하기";
                    document.getElementById('step2-title').innerHTML = "2단계: 거리의 합($2b$)을 이용하여 $b^2$ 값 구하기";
                    document.getElementById('step3-title').innerHTML = "3단계: 관계식($a^2 = b^2 - c^2$)을 이용하여 $a^2$의 값 구하기";
                }
                document.getElementById('step1_label').innerHTML = "$c =$ "; document.getElementById('step2_label').innerHTML = axis === 'x' ? "$a^2 =$ " : "$b^2 =$ "; document.getElementById('step3_label').innerHTML = axis === 'x' ? "$b^2 =$ " : "$a^2 =$ ";
                document.getElementById('step4-inputs').innerHTML = `<div class="fraction"><span class="num">$x^2$</span><input type="number" id="step4_A" class="eq-input" placeholder="분모"></div><span style="font-size:20px; font-weight:bold; margin: 0 5px;">$+$</span><div class="fraction"><span class="num">$y^2$</span><input type="number" id="step4_B" class="eq-input" placeholder="분모"></div><span style="font-size:20px; font-weight:bold; margin-left: 5px;">$= 1$</span>`;
            } else {
                document.getElementById('step3-card').style.display = 'block';
                let hyperC = hyp; let a = leg1; let b = leg2;
                if(axis === 'x') {
                    probData = { type: 'hyperbola', axis: 'x', c: hyperC, aSq: a*a, bSq: b*b, text: `두 초점 $F(${hyperC}, 0)$, $F'(-${hyperC}, 0)$로부터의 거리의 차가 $${2*a}$인 쌍곡선의 방정식을 구하시오.` };
                    document.getElementById('step2-title').innerHTML = "2단계: 거리의 차($2a$)를 이용하여 $a^2$ 값 구하기"; document.getElementById('step3-title').innerHTML = "3단계: 관계식($b^2 = c^2 - a^2$)을 이용하여 $b^2$의 값 구하기";
                } else {
                    probData = { type: 'hyperbola', axis: 'y', c: hyperC, aSq: a*a, bSq: b*b, text: `두 초점 $F(0, ${hyperC})$, $F'(0, -${hyperC})$로부터의 거리의 차가 $${2*b}$인 쌍곡선의 방정식을 구하시오.` };
                    document.getElementById('step2-title').innerHTML = "2단계: 거리의 차($2b$)를 이용하여 $b^2$ 값 구하기"; document.getElementById('step3-title').innerHTML = "3단계: 관계식($a^2 = c^2 - b^2$)을 이용하여 $a^2$의 값 구하기";
                }
                document.getElementById('step1-title').innerHTML = "1단계: 초점의 좌표에서 상수 $c$의 값 구하기"; document.getElementById('step1_label').innerHTML = "$c =$ ";
                document.getElementById('step2_label').innerHTML = axis === 'x' ? "$a^2 =$ " : "$b^2 =$ "; document.getElementById('step3_label').innerHTML = axis === 'x' ? "$b^2 =$ " : "$a^2 =$ ";
                let rhs = axis === 'x' ? '1' : '-1';
                document.getElementById('step4-inputs').innerHTML = `<div class="fraction"><span class="num">$x^2$</span><input type="number" id="step4_A" class="eq-input" placeholder="분모"></div><span style="font-size:20px; font-weight:bold; margin: 0 5px;">$-$</span><div class="fraction"><span class="num">$y^2$</span><input type="number" id="step4_B" class="eq-input" placeholder="분모"></div><span style="font-size:20px; font-weight:bold; margin-left: 5px;">$= ${rhs}$</span>`;
            }
            document.getElementById('problem-text').innerHTML = probData.text;
            if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise();
        }

        function checkSteps() {
            if (currentType === 'parabola') {
                let s1 = parseInt(document.getElementById('step1_ans').value); let s1_res = document.getElementById('step1_res');
                if(s1 === probData.p) { s1_res.innerHTML = "⭕ 정답!"; s1_res.className = "result-msg correct-text"; } else { s1_res.innerHTML = `❌ 오답 (정답: $${probData.p}$)`; s1_res.className = "result-msg incorrect-text"; }
                let s2 = parseInt(document.getElementById('step2_ans').value); let s2_res = document.getElementById('step2_res');
                if(s2 === 4 * probData.p) { s2_res.innerHTML = "⭕ 정답!"; s2_res.className = "result-msg correct-text"; } else { s2_res.innerHTML = `❌ 오답 (정답: $${4 * probData.p}$)`; s2_res.className = "result-msg incorrect-text"; }
                let s4A = parseInt(document.getElementById('step4_A').value); let s4_res = document.getElementById('step4_res');
                if(s4A === 4 * probData.p) { s4_res.innerHTML = "🎉 완벽합니다! 포물선의 방정식을 완성했어요!"; s4_res.className = "result-msg correct-text"; } else { s4_res.innerHTML = `❌ 오답 (정답 계수: $${4 * probData.p}$)`; s4_res.className = "result-msg incorrect-text"; }
            } else {
                let s1 = parseInt(document.getElementById('step1_ans').value); let s1_res = document.getElementById('step1_res');
                if(s1 === probData.c) { s1_res.innerHTML = "⭕ 정답!"; s1_res.className = "result-msg correct-text"; } else { s1_res.innerHTML = `❌ 오답 (정답: $${probData.c}$)`; s1_res.className = "result-msg incorrect-text"; }
                let s2 = parseInt(document.getElementById('step2_ans').value); let s2_res = document.getElementById('step2_res'); let targetS2 = (probData.axis === 'x') ? probData.aSq : probData.bSq;
                if(s2 === targetS2) { s2_res.innerHTML = "⭕ 정답!"; s2_res.className = "result-msg correct-text"; } else { s2_res.innerHTML = `❌ 오답 (정답: $${targetS2}$)`; s2_res.className = "result-msg incorrect-text"; }
                let s3 = parseInt(document.getElementById('step3_ans').value); let s3_res = document.getElementById('step3_res'); let targetS3 = (probData.axis === 'x') ? probData.bSq : probData.aSq;
                if(s3 === targetS3) { s3_res.innerHTML = "⭕ 정답!"; s3_res.className = "result-msg correct-text"; } else { s3_res.innerHTML = `❌ 오답 (정답: $${targetS3}$)`; s3_res.className = "result-msg incorrect-text"; }

                let s4A = parseInt(document.getElementById('step4_A').value); let s4B = parseInt(document.getElementById('step4_B').value); let s4_res = document.getElementById('step4_res');
                if(probData.type === 'ellipse') {
                    if(s4A === probData.aSq && s4B === probData.bSq) { s4_res.innerHTML = "🎉 완벽합니다! 타원의 방정식을 훌륭하게 완성했어요!"; s4_res.className = "result-msg correct-text"; } 
                    else { s4_res.innerHTML = `❌ 오답 (정답 분모: $x^2$밑은 $${probData.aSq}$, $y^2$밑은 $${probData.bSq}$)`; s4_res.className = "result-msg incorrect-text"; }
                } else {
                    if(s4A === probData.aSq && s4B === probData.bSq) { s4_res.innerHTML = "🎉 완벽합니다! 쌍곡선의 식 구조를 정확히 이해했네요!"; s4_res.className = "result-msg correct-text"; } 
                    else { s4_res.innerHTML = `❌ 오답 (정답 분모: $x^2$밑은 $${probData.aSq}$, $y^2$밑은 $${probData.bSq}$)`; s4_res.className = "result-msg incorrect-text"; }
                }
            }
            if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise();
        }
    </script>
</body>
</html>
