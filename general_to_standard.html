<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>이차곡선 일반형 ➔ 표준형 변환 훈련</title>
    <script>
        MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] } };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Noto Sans KR', sans-serif; 
            background-color: #fff5f8;
            background-image: radial-gradient(#fbcfe8 1px, transparent 1px);
            background-size: 20px 20px;
            color: #475569;
            -webkit-text-size-adjust: none;
        }
        .math-font { font-family: 'Times New Roman', Times, serif; font-style: italic; }
        
        .hero-bg { background: linear-gradient(135deg, #fdf4ff 0%, #fce7f3 50%, #e0e7ff 100%); position: relative; overflow: hidden; border-bottom: 1px solid white; }
        .blob { position: absolute; filter: blur(40px); z-index: 0; opacity: 0.6; animation: float 8s ease-in-out infinite; }
        .blob-1 { background: #fbcfe8; width: 300px; height: 300px; border-radius: 50%; top: -50px; left: -100px; animation-delay: 0s; }
        .blob-2 { background: #c7d2fe; width: 250px; height: 250px; border-radius: 50%; bottom: -80px; right: -50px; animation-delay: -3s; }
        .blob-3 { background: #e9d5ff; width: 200px; height: 200px; border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%, -50%); animation-delay: -5s; }
        @keyframes float { 0% { transform: translate(0, 0) scale(1); } 33% { transform: translate(20px, -30px) scale(1.05); } 66% { transform: translate(-20px, 20px) scale(0.95); } 100% { transform: translate(0, 0) scale(1); } }
        
        .glass-card { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.8); box-shadow: 0 10px 25px -5px rgba(244, 114, 182, 0.15); }
        .highlight { position: relative; display: inline-block; z-index: 1; }
        .highlight::after { content: ''; position: absolute; bottom: 2px; left: -2px; right: -2px; height: 10px; background-color: #fce7f3; z-index: -1; border-radius: 4px; }

        .tab-btn { flex: 1; padding: 16px; text-align: center; color: #64748b; font-weight: bold; border-bottom: 4px solid transparent; transition: all 0.2s; cursor: pointer; }
        .tab-btn:hover { background-color: rgba(255,255,255,0.5); }
        .tab-parabola.active { border-color: #f472b6; color: #db2777; background-color: white; }
        .tab-ellipse.active { border-color: #818cf8; color: #4f46e5; background-color: white; }
        .tab-hyperbola.active { border-color: #c084fc; color: #7e22ce; background-color: white; }

        .input-box { width: 60px; height: 40px; text-align: center; font-size: 1.1rem; font-weight: bold; border: 2px solid #fce7f3; border-radius: 8px; outline: none; transition: all 0.2s; background-color: #fff; color: #334155; }
        .input-box:focus { border-color: #f472b6; box-shadow: 0 0 0 3px rgba(244, 114, 182, 0.2); }
        .input-box.correct { border-color: #34d399; background-color: #f0fdf4; color: #15803d; }
        .input-box.wrong { border-color: #fb7185; background-color: #fff1f2; color: #be123c; }

        .fraction { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; margin: 0 0.5rem; }
        .fraction > span:first-child { border-bottom: 2px solid #334155; padding: 0 0.25rem 0.25rem 0.25rem; width: 100%; text-align: center; }
        .fraction > span:last-child { padding: 0.25rem 0.25rem 0; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center">

    <header class="hero-bg w-full py-12 px-4 text-center shadow-sm relative mb-8">
        <div class="blob blob-1"></div><div class="blob blob-2"></div><div class="blob blob-3"></div>
        <div class="max-w-3xl mx-auto relative z-10">
            <div class="inline-block bg-white/80 text-pink-500 text-xs font-bold px-4 py-1.5 rounded-full mb-4 shadow-sm border border-pink-100">
                ✨ 기하 계산력 강화 프로젝트
            </div>
            <h1 class="text-3xl md:text-4xl font-black text-slate-700 mb-3 tracking-tight">일반형 $\rightarrow$ 표준형 변환 <span class="highlight text-pink-500">훈련</span> 🎀</h1>
            <p class="text-slate-500 font-medium mb-2">주어진 이차곡선의 방정식을 완전제곱식으로 예쁘게 정리해 보세요.</p>
        </div>
    </header>

    <main class="w-full max-w-3xl glass-card rounded-3xl overflow-hidden mb-12 relative z-10">
        
        <div class="flex border-b border-pink-100 bg-white/40">
            <button class="tab-btn tab-parabola" onclick="setMode('parabola')">🌸 포물선</button>
            <button class="tab-btn tab-ellipse" onclick="setMode('ellipse')">🦋 타원</button>
            <button class="tab-btn tab-hyperbola" onclick="setMode('hyperbola')">🔮 쌍곡선</button>
        </div>

        <div class="p-6 md:p-8">
            <div class="bg-pink-50 border border-pink-200 text-pink-800 text-xs md:text-sm p-4 rounded-xl mb-6 shadow-sm font-medium">
                💡 <strong>입력 가이드:</strong> 식의 구조 $(x - \square)^2$ 에 맞추어 값을 입력하세요.<br>
                예를 들어 식을 정리했을 때 $(x + 2)^2$ 가 나온다면, 빈칸에는 <strong>-2</strong> 를 입력해야 합니다.
            </div>

            <div class="text-center mb-8">
                <div class="text-slate-500 font-bold mb-3 text-sm">주어진 일반형 방정식</div>
                <div id="equation-display" class="math-font text-2xl md:text-3xl font-black text-slate-700 bg-white/80 py-5 px-8 rounded-2xl inline-block border border-pink-100 shadow-sm">
                    <!-- 수식 주입 -->
                </div>
            </div>

            <div class="flex items-center justify-center mb-6">
                <div class="w-10 h-10 rounded-full bg-pink-100 flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-pink-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3" /></svg>
                </div>
            </div>

            <div class="text-center mb-8">
                <div class="text-slate-500 font-bold mb-3 text-sm">표준형으로 변환 (빈칸 채우기)</div>
                <div id="input-container" class="flex flex-wrap justify-center items-center gap-2 text-xl md:text-2xl font-bold text-slate-700 math-font bg-white p-6 rounded-2xl border-2 border-dashed border-pink-200 shadow-inner">
                    <!-- 동적 입력창 주입 -->
                </div>
            </div>

            <div id="feedback-msg" class="text-center font-bold text-lg mb-6 h-6"></div>

            <div class="flex flex-col sm:flex-row gap-3">
                <button onclick="checkAnswers()" class="flex-1 py-3 bg-slate-700 hover:bg-slate-800 text-white font-bold rounded-xl shadow-md transition transform active:scale-95 text-lg">
                    정답 확인하기
                </button>
                <button id="btn-next" onclick="generateProblem()" class="flex-1 py-3 text-white font-bold rounded-xl shadow-md transition transform active:scale-95 text-lg" style="background-color: #f472b6;">
                    새로운 문제 생성
                </button>
            </div>
        </div>
    </main>

    <script>
        let currentMode = 'parabola';
        let answerData = {};
        let themeColor = '#f472b6';

        function getRand(min, max, excludeZero = false) {
            let val = 0; while (true) { val = Math.floor(Math.random() * (max - min + 1)) + min; if (excludeZero && val === 0) continue; break; }
            return val;
        }

        function buildPolynomial(terms) {
            let str = ''; let isFirst = true;
            for (let t of terms) {
                if (t.c === 0) continue;
                let cStr = ''; let absC = Math.abs(t.c);
                if (t.v === '') cStr = absC.toString(); else { if (absC === 1) cStr = t.v; else cStr = absC.toString() + t.v; }
                if (isFirst) { str += (t.c < 0 ? '-' : '') + cStr; isFirst = false; } else { str += (t.c < 0 ? ' - ' : ' + ') + cStr; }
            }
            return str === '' ? '0' : str;
        }

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`.tab-${mode}`).classList.add('active');
            if (mode === 'parabola') themeColor = '#f472b6'; else if (mode === 'ellipse') themeColor = '#818cf8'; else if (mode === 'hyperbola') themeColor = '#c084fc';
            document.getElementById('btn-next').style.backgroundColor = themeColor;
            generateProblem();
        }

        function generateProblem() {
            document.getElementById('feedback-msg').innerText = '';
            const inputContainer = document.getElementById('input-container');
            inputContainer.innerHTML = ''; answerData = {}; let equationStr = '';

            if (currentMode === 'parabola') {
                let p = getRand(-4, 4, true); let m = getRand(-5, 5); let n = getRand(-5, 5); let isY2 = Math.random() > 0.5; 
                if (isY2) {
                    let terms = [ {c: 1, v: 'y²'}, {c: -4*p, v: 'x'}, {c: -2*n, v: 'y'}, {c: (n*n + 4*p*m), v: ''} ];
                    equationStr = buildPolynomial(terms) + ' = 0';
                    inputContainer.innerHTML = `<span>(</span><span class="mx-1">y - </span><input type="number" id="ans_n" class="input-box"><span>)²</span><span class="mx-3">=</span><input type="number" id="ans_4p" class="input-box" style="width:70px;"><span class="ml-2">(</span><span class="mx-1">x - </span><input type="number" id="ans_m" class="input-box"><span>)</span>`;
                    answerData = { ans_n: n, ans_4p: 4*p, ans_m: m };
                } else {
                    let terms = [ {c: 1, v: 'x²'}, {c: -2*m, v: 'x'}, {c: -4*p, v: 'y'}, {c: (m*m + 4*p*n), v: ''} ];
                    equationStr = buildPolynomial(terms) + ' = 0';
                    inputContainer.innerHTML = `<span>(</span><span class="mx-1">x - </span><input type="number" id="ans_m" class="input-box"><span>)²</span><span class="mx-3">=</span><input type="number" id="ans_4p" class="input-box" style="width:70px;"><span class="ml-2">(</span><span class="mx-1">y - </span><input type="number" id="ans_n" class="input-box"><span>)</span>`;
                    answerData = { ans_m: m, ans_4p: 4*p, ans_n: n };
                }
            } 
            else if (currentMode === 'ellipse') {
                let a = getRand(2, 5); let b = getRand(2, 5); while(a === b) { b = getRand(2, 5); } 
                let A = a*a; let B = b*b; let m = getRand(-4, 4); let n = getRand(-4, 4);
                let terms = [ {c: B, v: 'x²'}, {c: A, v: 'y²'}, {c: -2*B*m, v: 'x'}, {c: -2*A*n, v: 'y'}, {c: (B*m*m + A*n*n - A*B), v: ''} ];
                equationStr = buildPolynomial(terms) + ' = 0';
                inputContainer.innerHTML = `<div class="fraction"><span>( x - <input type="number" id="ans_m" class="input-box mb-1"> )²</span><span><input type="number" id="ans_A" class="input-box mt-1"></span></div><span class="mx-2">+</span><div class="fraction"><span>( y - <input type="number" id="ans_n" class="input-box mb-1"> )²</span><span><input type="number" id="ans_B" class="input-box mt-1"></span></div><span class="ml-3">= 1</span>`;
                answerData = { ans_m: m, ans_A: A, ans_n: n, ans_B: B };
            } 
            else if (currentMode === 'hyperbola') {
                let a = getRand(2, 5); let b = getRand(2, 5); let A = a*a; let B = b*b; let m = getRand(-4, 4); let n = getRand(-4, 4);
                let isRight = Math.random() > 0.5; let rhs = isRight ? 1 : -1; let terms = [];
                if (isRight) { terms = [ {c: B, v: 'x²'}, {c: -A, v: 'y²'}, {c: -2*B*m, v: 'x'}, {c: 2*A*n, v: 'y'}, {c: (B*m*m - A*n*n - A*B), v: ''} ]; } 
                else { terms = [ {c: -B, v: 'x²'}, {c: A, v: 'y²'}, {c: 2*B*m, v: 'x'}, {c: -2*A*n, v: 'y'}, {c: -(B*m*m - A*n*n + A*B), v: ''} ]; }
                equationStr = buildPolynomial(terms) + ' = 0';
                inputContainer.innerHTML = `<div class="fraction"><span>( x - <input type="number" id="ans_m" class="input-box mb-1"> )²</span><span><input type="number" id="ans_A" class="input-box mt-1"></span></div><span class="mx-2">-</span><div class="fraction"><span>( y - <input type="number" id="ans_n" class="input-box mb-1"> )²</span><span><input type="number" id="ans_B" class="input-box mt-1"></span></div><span class="ml-2">=</span><input type="number" id="ans_rhs" class="input-box ml-2" style="width: 50px;">`;
                answerData = { ans_m: m, ans_A: A, ans_n: n, ans_B: B, ans_rhs: rhs };
            }

            document.getElementById('equation-display').innerHTML = equationStr;
            const inputs = document.querySelectorAll('.input-box');
            inputs.forEach((input, index) => {
                input.addEventListener('keypress', function(e) { if (e.key === 'Enter') { if (index < inputs.length - 1) inputs[index + 1].focus(); else checkAnswers(); } });
            });
        }

        function checkAnswers() {
            let allCorrect = true;
            for (let key in answerData) {
                let inputEl = document.getElementById(key); if (!inputEl) continue;
                let userVal = parseInt(inputEl.value); let correctVal = answerData[key];
                inputEl.classList.remove('correct', 'wrong');
                if (isNaN(userVal) || userVal !== correctVal) { inputEl.value = correctVal; inputEl.classList.add('wrong'); allCorrect = false; } 
                else { inputEl.classList.add('correct'); }
            }
            const msgEl = document.getElementById('feedback-msg');
            if (allCorrect) { msgEl.innerHTML = `<span style="color: ${themeColor};">🎉 완벽합니다! 완전제곱식으로 정확히 정리했습니다.</span>`; } 
            else { msgEl.innerHTML = `<span style="color: #fb7185;">💡 빈칸 및 오답 위치에 올바른 정답이 표시되었습니다. 부호와 계산을 다시 확인해 보세요.</span>`; }
        }

        window.onload = function() { setMode('parabola'); };
    </script>
</body>
</html>
