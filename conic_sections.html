<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이차곡선의 정의 시각화 도구</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Noto Sans KR', sans-serif; 
            background-color: #fff5f8;
            background-image: radial-gradient(#fbcfe8 1px, transparent 1px);
            background-size: 20px 20px;
            color: #475569;
        }
        canvas { background-color: #ffffff; cursor: crosshair; touch-action: none; border-radius: 12px; }
        .hero-bg {
            background: linear-gradient(135deg, #fdf4ff 0%, #fce7f3 50%, #e0e7ff 100%);
            position: relative;
            overflow: hidden;
            border-bottom: 1px solid white;
        }
        .blob { position: absolute; filter: blur(40px); z-index: 0; opacity: 0.6; animation: float 8s ease-in-out infinite; }
        .blob-1 { background: #fbcfe8; width: 300px; height: 300px; border-radius: 50%; top: -50px; left: -100px; animation-delay: 0s; }
        .blob-2 { background: #c7d2fe; width: 250px; height: 250px; border-radius: 50%; bottom: -80px; right: -50px; animation-delay: -3s; }
        .blob-3 { background: #e9d5ff; width: 200px; height: 200px; border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%, -50%); animation-delay: -5s; }
        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(20px, -30px) scale(1.05); }
            66% { transform: translate(-20px, 20px) scale(0.95); }
            100% { transform: translate(0, 0) scale(1); }
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 10px 25px -5px rgba(244, 114, 182, 0.15);
        }
        .highlight { position: relative; display: inline-block; z-index: 1; }
        .highlight::after { content: ''; position: absolute; bottom: 2px; left: -2px; right: -2px; height: 10px; background-color: #fce7f3; z-index: -1; border-radius: 4px; }
        
        .tab-active { background-color: white; border: 2px solid #fbcfe8; color: #db2777; font-weight: bold; border-radius: 12px; box-shadow: 0 4px 6px rgba(244, 114, 182, 0.1); }
        .tab-inactive { color: #64748b; border: 2px solid transparent; border-radius: 12px; }
        .tab-inactive:hover { background-color: rgba(255,255,255,0.5); color: #db2777; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center">

    <header class="hero-bg w-full py-12 px-4 text-center shadow-sm relative mb-8">
        <div class="blob blob-1"></div><div class="blob blob-2"></div><div class="blob blob-3"></div>
        <div class="max-w-4xl mx-auto relative z-10">
            <div class="inline-block bg-white/80 text-pink-500 text-xs font-bold px-4 py-1.5 rounded-full mb-4 shadow-sm border border-pink-100">
                ✨ 개념 시각화 실험실
            </div>
            <h1 class="text-3xl md:text-4xl font-black text-slate-700 mb-3 tracking-tight">이차곡선의 정의 <span class="highlight text-pink-500">시각화</span> 🎀</h1>
            <p class="text-slate-500 font-medium">포물선, 타원, 쌍곡선이 그려지는 원리를 동적으로 관찰해 보세요.</p>
        </div>
    </header>

    <div class="w-full max-w-5xl glass-card rounded-3xl overflow-hidden flex flex-col md:flex-row relative z-10 mb-12">
        
        <!-- 왼쪽 패널: 컨트롤 -->
        <div class="w-full md:w-1/3 bg-white/50 border-r border-pink-100 p-6 flex flex-col">
            
            <!-- 탭 메뉴 -->
            <div class="flex gap-2 mb-6">
                <button id="tab-parabola" class="flex-1 py-3 text-center tab-active transition" onclick="switchTab('parabola')">🌸 포물선</button>
                <button id="tab-ellipse" class="flex-1 py-3 text-center tab-inactive transition" onclick="switchTab('ellipse')">🦋 타원</button>
                <button id="tab-hyperbola" class="flex-1 py-3 text-center tab-inactive transition" onclick="switchTab('hyperbola')">🔮 쌍곡선</button>
            </div>

            <!-- 상태 표시 패널 -->
            <div id="equation-display" class="bg-white border border-pink-200 text-pink-600 p-4 rounded-2xl mb-6 font-mono font-bold text-center text-lg shadow-sm">
                y² = 4px
            </div>

            <!-- 포물선 컨트롤 -->
            <div id="controls-parabola" class="flex-col gap-6 flex">
                <div class="bg-white/60 p-4 rounded-xl border border-white">
                    <label class="flex justify-between text-sm font-bold text-slate-600 mb-2">
                        <span>초점 매개변수 (p)</span>
                        <span id="val-p" class="font-black text-pink-500">1</span>
                    </label>
                    <input type="range" id="slider-p" min="-5" max="5" step="0.5" value="1" class="w-full accent-pink-400">
                </div>
                <div class="bg-white/60 p-4 rounded-xl border border-white">
                    <label class="flex justify-between text-sm font-bold text-slate-600 mb-2">
                        <span>점 P의 위치 (y좌표)</span>
                    </label>
                    <input type="range" id="slider-py" min="-8" max="8" step="0.1" value="3" class="w-full accent-emerald-400">
                </div>
            </div>

            <!-- 타원 컨트롤 -->
            <div id="controls-ellipse" class="flex-col gap-6 hidden">
                <div class="bg-white/60 p-4 rounded-xl border border-white">
                    <label class="flex justify-between text-sm font-bold text-slate-600 mb-2">
                        <span>x축 방향 길이 (a)</span>
                        <span id="val-a" class="font-black text-indigo-500">5</span>
                    </label>
                    <input type="range" id="slider-a" min="1" max="9" step="0.5" value="5" class="w-full accent-indigo-400">
                </div>
                <div class="bg-white/60 p-4 rounded-xl border border-white">
                    <label class="flex justify-between text-sm font-bold text-slate-600 mb-2">
                        <span>y축 방향 길이 (b)</span>
                        <span id="val-b" class="font-black text-purple-500">3</span>
                    </label>
                    <input type="range" id="slider-b" min="1" max="9" step="0.5" value="3" class="w-full accent-purple-400">
                </div>
                <div class="bg-white/60 p-4 rounded-xl border border-white">
                    <label class="flex justify-between text-sm font-bold text-slate-600 mb-2">
                        <span>점 P의 위치 (각도)</span>
                    </label>
                    <input type="range" id="slider-angle" min="0" max="360" step="1" value="45" class="w-full accent-emerald-400">
                </div>
            </div>

            <!-- 쌍곡선 컨트롤 -->
            <div id="controls-hyperbola" class="flex-col gap-6 hidden">
                <div class="bg-white/60 p-4 rounded-xl border border-white">
                    <label class="flex justify-between text-sm font-bold text-slate-600 mb-2">
                        <span>주축 방향 길이 변수 (a)</span>
                        <span id="val-ha" class="font-black text-indigo-500">4</span>
                    </label>
                    <input type="range" id="slider-ha" min="1" max="8" step="0.5" value="4" class="w-full accent-indigo-400">
                </div>
                <div class="bg-white/60 p-4 rounded-xl border border-white">
                    <label class="flex justify-between text-sm font-bold text-slate-600 mb-2">
                        <span>켤레축 방향 길이 변수 (b)</span>
                        <span id="val-hb" class="font-black text-purple-500">3</span>
                    </label>
                    <input type="range" id="slider-hb" min="1" max="8" step="0.5" value="3" class="w-full accent-purple-400">
                </div>
                <div class="bg-white/60 p-4 rounded-xl border border-white">
                    <label class="flex justify-between text-sm font-bold text-slate-600 mb-2">
                        <span>점 P의 위치 (매개변수)</span>
                    </label>
                    <input type="range" id="slider-ht" min="-2.5" max="2.5" step="0.05" value="0.5" class="w-full accent-emerald-400">
                </div>
            </div>

            <div class="mt-8 flex gap-2">
                <button id="btn-animate" class="flex-1 bg-pink-400 hover:bg-pink-500 text-white font-bold py-3 px-4 rounded-xl transition shadow-md" onclick="toggleAnimation()">
                    ▶ 자동 이동
                </button>
            </div>

            <div class="mt-auto pt-6 border-t border-pink-100">
                <h3 class="font-bold text-slate-700 mb-2">기하학적 정의</h3>
                <div id="def-parabola" class="text-sm text-slate-500 leading-relaxed bg-white/60 p-3 rounded-lg border border-white">
                    평면 위의 한 점 <span class="text-rose-500 font-bold">초점(F)</span>과 그 점을 지나지 않는 한 직선 <span class="text-blue-500 font-bold">준선(l)</span>에 이르는 <span class="text-emerald-600 font-bold">거리가 같은 점(P)</span>들의 모임. <br>
                    <strong class="mt-2 block text-center bg-white p-2 rounded border border-pink-100"><span id="calc-parabola">PF = PH = 0.00</span></strong>
                </div>
                <div id="def-ellipse" class="text-sm text-slate-500 leading-relaxed bg-white/60 p-3 rounded-lg border border-white hidden">
                    평면 위의 두 <span class="text-rose-500 font-bold">초점(F, F')</span>으로부터의 <span class="text-emerald-600 font-bold">거리의 합이 일정한 점(P)</span>들의 모임.<br>
                    <strong class="mt-2 block text-center bg-white p-2 rounded border border-indigo-100"><span id="calc-ellipse">PF + PF' = 0.00</span></strong>
                </div>
                <div id="def-hyperbola" class="text-sm text-slate-500 leading-relaxed bg-white/60 p-3 rounded-lg border border-white hidden">
                    평면 위의 두 <span class="text-rose-500 font-bold">초점(F, F')</span>으로부터의 <span class="text-emerald-600 font-bold">거리의 차가 일정한 점(P)</span>들의 모임.<br>
                    <strong class="mt-2 block text-center bg-white p-2 rounded border border-purple-100"><span id="calc-hyperbola">|PF - PF'| = 0.00</span></strong>
                </div>
            </div>
        </div>

        <!-- 오른쪽 패널: 캔버스 -->
        <div class="w-full md:w-2/3 relative flex justify-center items-center p-4 md:p-8 bg-white/30 backdrop-blur-sm">
            <canvas id="mathCanvas" width="600" height="600" class="w-full max-w-[600px] h-auto border-2 border-white shadow-lg"></canvas>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('mathCanvas');
        const ctx = canvas.getContext('2d');
        const scale = 30; 
        const originX = canvas.width / 2;
        const originY = canvas.height / 2;

        let currentMode = 'parabola';
        let isAnimating = false;
        let animationId;

        let state = { p: 2, py: 3, a: 5, b: 3, angle: 45, ha: 4, hb: 3, ht: 0.5, htDir: 1 };

        const sliders = {
            p: document.getElementById('slider-p'), py: document.getElementById('slider-py'),
            a: document.getElementById('slider-a'), b: document.getElementById('slider-b'), angle: document.getElementById('slider-angle'),
            ha: document.getElementById('slider-ha'), hb: document.getElementById('slider-hb'), ht: document.getElementById('slider-ht')
        };
        const displays = {
            p: document.getElementById('val-p'), a: document.getElementById('val-a'), b: document.getElementById('val-b'),
            ha: document.getElementById('val-ha'), hb: document.getElementById('val-hb'), eq: document.getElementById('equation-display'),
            calcP: document.getElementById('calc-parabola'), calcE: document.getElementById('calc-ellipse'), calcH: document.getElementById('calc-hyperbola')
        };

        sliders.p.addEventListener('input', (e) => { let val = parseFloat(e.target.value); if(val === 0) { val = 0.5; sliders.p.value = 0.5; } state.p = val; displays.p.innerText = val; updateUI(); render(); });
        sliders.py.addEventListener('input', (e) => { state.py = parseFloat(e.target.value); render(); });
        sliders.a.addEventListener('input', (e) => { state.a = parseFloat(e.target.value); displays.a.innerText = state.a; updateUI(); render(); });
        sliders.b.addEventListener('input', (e) => { state.b = parseFloat(e.target.value); displays.b.innerText = state.b; updateUI(); render(); });
        sliders.angle.addEventListener('input', (e) => { state.angle = parseFloat(e.target.value); render(); });
        sliders.ha.addEventListener('input', (e) => { state.ha = parseFloat(e.target.value); displays.ha.innerText = state.ha; updateUI(); render(); });
        sliders.hb.addEventListener('input', (e) => { state.hb = parseFloat(e.target.value); displays.hb.innerText = state.hb; updateUI(); render(); });
        sliders.ht.addEventListener('input', (e) => { state.ht = parseFloat(e.target.value); render(); });

        function switchTab(mode) {
            currentMode = mode;
            document.getElementById('tab-parabola').className = mode === 'parabola' ? 'flex-1 py-3 text-center tab-active transition' : 'flex-1 py-3 text-center tab-inactive transition';
            document.getElementById('tab-ellipse').className = mode === 'ellipse' ? 'flex-1 py-3 text-center tab-active transition' : 'flex-1 py-3 text-center tab-inactive transition';
            document.getElementById('tab-hyperbola').className = mode === 'hyperbola' ? 'flex-1 py-3 text-center tab-active transition' : 'flex-1 py-3 text-center tab-inactive transition';
            
            document.getElementById('controls-parabola').style.display = mode === 'parabola' ? 'flex' : 'none';
            document.getElementById('controls-ellipse').style.display = mode === 'ellipse' ? 'flex' : 'none';
            document.getElementById('controls-hyperbola').style.display = mode === 'hyperbola' ? 'flex' : 'none';
            
            document.getElementById('def-parabola').style.display = mode === 'parabola' ? 'block' : 'none';
            document.getElementById('def-ellipse').style.display = mode === 'ellipse' ? 'block' : 'none';
            document.getElementById('def-hyperbola').style.display = mode === 'hyperbola' ? 'block' : 'none';

            updateUI();
            render();
        }

        function updateUI() {
            if (currentMode === 'parabola') {
                displays.eq.innerHTML = `y² = ${4 * state.p}x`;
            } else if (currentMode === 'ellipse') {
                displays.eq.innerHTML = `<span class="inline-block"><div class="border-b border-indigo-200 px-1">x²</div><div class="px-1">${state.a**2}</div></span> + <span class="inline-block"><div class="border-b border-indigo-200 px-1">y²</div><div class="px-1">${state.b**2}</div></span> = 1`;
            } else {
                displays.eq.innerHTML = `<span class="inline-block"><div class="border-b border-purple-200 px-1">x²</div><div class="px-1">${state.ha**2}</div></span> - <span class="inline-block"><div class="border-b border-purple-200 px-1">y²</div><div class="px-1">${state.hb**2}</div></span> = 1`;
            }
        }

        function toggleAnimation() {
            isAnimating = !isAnimating;
            const btn = document.getElementById('btn-animate');
            if (isAnimating) {
                btn.innerHTML = '❚❚ 일시정지';
                btn.classList.replace('bg-pink-400', 'bg-amber-400');
                btn.classList.replace('hover:bg-pink-500', 'hover:bg-amber-500');
                animate();
            } else {
                btn.innerHTML = '▶ 자동 이동';
                btn.classList.replace('bg-amber-400', 'bg-pink-400');
                btn.classList.replace('hover:bg-amber-500', 'hover:bg-pink-500');
                cancelAnimationFrame(animationId);
            }
        }

        function animate() {
            if (currentMode === 'parabola') {
                state.py += 0.05; if (state.py > 8) state.py = -8; sliders.py.value = state.py;
            } else if (currentMode === 'ellipse') {
                state.angle += 0.5; if (state.angle >= 360) state.angle = 0; sliders.angle.value = state.angle;
            } else {
                state.ht += 0.02 * state.htDir; if (state.ht >= 2.5 || state.ht <= -2.5) state.htDir *= -1; sliders.ht.value = state.ht;
            }
            render();
            if (isAnimating) animationId = requestAnimationFrame(animate);
        }

        function toCanvasX(x) { return originX + x * scale; }
        function toCanvasY(y) { return originY - y * scale; }

        function drawGrid() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.lineWidth = 1;
            for (let i = -20; i <= 20; i++) {
                ctx.strokeStyle = i === 0 ? '#475569' : '#f1f5f9';
                ctx.beginPath(); ctx.moveTo(toCanvasX(i), 0); ctx.lineTo(toCanvasX(i), canvas.height); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, toCanvasY(i)); ctx.lineTo(canvas.width, toCanvasY(i)); ctx.stroke();
                if (i !== 0 && i % 2 === 0) { ctx.fillStyle = '#94a3b8'; ctx.font = '10px Arial'; ctx.fillText(i, toCanvasX(i) + 5, originY + 15); ctx.fillText(i, originX + 5, toCanvasY(i) - 5); }
            }
            ctx.fillStyle = '#475569'; ctx.font = '14px Arial font-bold'; ctx.fillText('x', canvas.width - 15, originY - 10); ctx.fillText('y', originX + 10, 15); ctx.fillText('O', originX - 15, originY + 15);
        }

        function drawPoint(x, y, color, label, labelOffsetX = 10, labelOffsetY = -10) {
            const cx = toCanvasX(x); const cy = toCanvasY(y);
            ctx.beginPath(); ctx.arc(cx, cy, 5, 0, Math.PI * 2); ctx.fillStyle = color; ctx.fill();
            ctx.fillStyle = color; ctx.font = 'bold 14px Arial'; ctx.fillText(label, cx + labelOffsetX, cy + labelOffsetY);
        }

        function drawLine(x1, y1, x2, y2, color, isDashed = false) {
            ctx.beginPath(); ctx.moveTo(toCanvasX(x1), toCanvasY(y1)); ctx.lineTo(toCanvasX(x2), toCanvasY(y2));
            ctx.strokeStyle = color; ctx.lineWidth = 2; if (isDashed) ctx.setLineDash([5, 5]); else ctx.setLineDash([]); ctx.stroke(); ctx.setLineDash([]);
        }

        function renderParabola() {
            const { p, py } = state;
            ctx.beginPath(); ctx.strokeStyle = '#475569'; ctx.lineWidth = 3;
            for (let y = -10; y <= 10; y += 0.1) { let x = (y * y) / (4 * p); if (y === -10) ctx.moveTo(toCanvasX(x), toCanvasY(y)); else ctx.lineTo(toCanvasX(x), toCanvasY(y)); }
            ctx.stroke();

            drawPoint(p, 0, '#fb7185', 'F');
            ctx.beginPath(); ctx.moveTo(toCanvasX(-p), 0); ctx.lineTo(toCanvasX(-p), canvas.height); ctx.strokeStyle = '#60a5fa'; ctx.lineWidth = 2; ctx.stroke(); ctx.fillStyle = '#60a5fa'; ctx.fillText('준선 l', toCanvasX(-p) - 40, 20);

            const px = (py * py) / (4 * p);
            drawPoint(px, py, '#34d399', 'P(x,y)');
            drawPoint(-p, py, '#60a5fa', 'H', -20, -10);
            drawLine(px, py, p, 0, '#fb7185', true); drawLine(px, py, -p, py, '#60a5fa', true);

            const distPF = Math.sqrt(Math.pow(px - p, 2) + Math.pow(py - 0, 2)); const distPH = Math.abs(px - (-p));
            displays.calcP.innerHTML = `<span class="text-rose-500">PF (${distPF.toFixed(2)})</span> = <span class="text-blue-500">PH (${distPH.toFixed(2)})</span>`;
        }

        function renderEllipse() {
            const { a, b, angle } = state;
            ctx.beginPath(); ctx.strokeStyle = '#475569'; ctx.lineWidth = 3;
            for (let i = 0; i <= 360; i++) { let rad = i * Math.PI / 180; let x = a * Math.cos(rad); let y = b * Math.sin(rad); if (i === 0) ctx.moveTo(toCanvasX(x), toCanvasY(y)); else ctx.lineTo(toCanvasX(x), toCanvasY(y)); }
            ctx.stroke();

            let c, isXAxis;
            if (a >= b) { c = Math.sqrt(a*a - b*b); isXAxis = true; } else { c = Math.sqrt(b*b - a*a); isXAxis = false; }
            let f1 = isXAxis ? {x: c, y: 0} : {x: 0, y: c}; let f2 = isXAxis ? {x: -c, y: 0} : {x: 0, y: -c};
            drawPoint(f1.x, f1.y, '#fb7185', 'F'); drawPoint(f2.x, f2.y, '#fb7185', "F'", -20, 20);

            let rad = angle * Math.PI / 180; let px = a * Math.cos(rad); let py = b * Math.sin(rad);
            drawPoint(px, py, '#34d399', 'P(x,y)');
            drawLine(px, py, f1.x, f1.y, '#fb7185', true); drawLine(px, py, f2.x, f2.y, '#fb7185', true);

            const dist1 = Math.sqrt(Math.pow(px - f1.x, 2) + Math.pow(py - f1.y, 2)); const dist2 = Math.sqrt(Math.pow(px - f2.x, 2) + Math.pow(py - f2.y, 2)); const sum = dist1 + dist2;
            displays.calcE.innerHTML = `<span class="text-rose-500">PF (${dist1.toFixed(2)}) + PF' (${dist2.toFixed(2)})</span> = <span class="text-indigo-600 font-black">${sum.toFixed(2)} (일정)</span>`;
        }

        function renderHyperbola() {
            const { ha, hb, ht } = state;
            ctx.beginPath(); ctx.moveTo(toCanvasX(-15), toCanvasY(-15 * hb / ha)); ctx.lineTo(toCanvasX(15), toCanvasY(15 * hb / ha)); ctx.moveTo(toCanvasX(-15), toCanvasY(15 * hb / ha)); ctx.lineTo(toCanvasX(15), toCanvasY(-15 * hb / ha)); ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 1; ctx.setLineDash([5, 5]); ctx.stroke(); ctx.setLineDash([]);
            ctx.fillStyle = '#94a3b8'; ctx.font = '12px Arial'; ctx.fillText('점근선', toCanvasX(12), toCanvasY(12 * hb / ha) - 10);

            ctx.beginPath(); ctx.strokeStyle = '#475569'; ctx.lineWidth = 3;
            for (let t = -3; t <= 3; t += 0.1) { let x = ha * Math.cosh(t); let y = hb * Math.sinh(t); if (t === -3) ctx.moveTo(toCanvasX(x), toCanvasY(y)); else ctx.lineTo(toCanvasX(x), toCanvasY(y)); } ctx.stroke();
            ctx.beginPath(); for (let t = -3; t <= 3; t += 0.1) { let x = -ha * Math.cosh(t); let y = hb * Math.sinh(t); if (t === -3) ctx.moveTo(toCanvasX(x), toCanvasY(y)); else ctx.lineTo(toCanvasX(x), toCanvasY(y)); } ctx.stroke();

            let c = Math.sqrt(ha*ha + hb*hb); let f1 = {x: c, y: 0}; let f2 = {x: -c, y: 0};
            drawPoint(f1.x, f1.y, '#fb7185', 'F'); drawPoint(f2.x, f2.y, '#fb7185', "F'", -25, 20);

            let px = ha * Math.cosh(ht); let py = hb * Math.sinh(ht);
            drawPoint(px, py, '#34d399', 'P(x,y)');
            drawLine(px, py, f1.x, f1.y, '#fb7185', true); drawLine(px, py, f2.x, f2.y, '#fb7185', true);

            const dist1 = Math.sqrt(Math.pow(px - f1.x, 2) + Math.pow(py - f1.y, 2)); const dist2 = Math.sqrt(Math.pow(px - f2.x, 2) + Math.pow(py - f2.y, 2)); const diff = Math.abs(dist1 - dist2);
            displays.calcH.innerHTML = `|<span class="text-rose-500">PF (${dist1.toFixed(2)}) - PF' (${dist2.toFixed(2)})</span>| = <span class="text-purple-600 font-black">${diff.toFixed(2)} (일정)</span>`;
        }

        function render() { drawGrid(); if (currentMode === 'parabola') renderParabola(); else if (currentMode === 'ellipse') renderEllipse(); else renderHyperbola(); }

        updateUI(); render();
    </script>
</body>
</html>
