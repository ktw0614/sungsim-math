<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>이차곡선 일반형 ➔ 표준형 변환 훈련</title>
    <!-- MathJax 렌더링을 위한 스크립트 추가 -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']]
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f1f5f9; -webkit-text-size-adjust: none; }
        .math-font { font-family: 'Times New Roman', Times, serif; font-style: italic; }
        
        /* 탭 버튼 스타일 */
        .tab-btn {
            transition: all 0.2s ease;
        }
        .tab-btn.active {
            border-bottom-width: 4px;
            font-weight: bold;
        }
        /* 각 곡선별 테마 색상 */
        .tab-parabola.active { border-color: #10b981; color: #047857; background-color: white; } /* Emerald */
        .tab-ellipse.active { border-color: #3b82f6; color: #1d4ed8; background-color: white; } /* Blue */
        .tab-hyperbola.active { border-color: #8b5cf6; color: #6d28d9; background-color: white; } /* Violet */

        /* 입력창 스타일 */
        .input-box {
            width: 60px;
            height: 40px;
            text-align: center;
            font-size: 1.1rem;
            font-weight: bold;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            transition: all 0.2s;
            background-color: #fff;
            color: #1e293b;
        }
        .input-box:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }
        .input-box.correct {
            border-color: #22c55e;
            background-color: #f0fdf4;
            color: #15803d;
        }
        .input-box.wrong {
            border-color: #ef4444;
            background-color: #fef2f2;
            color: #b91c1c;
        }

        /* 분수 스타일 */
        .fraction {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            vertical-align: middle;
            margin: 0 0.5rem;
        }
        .fraction > span:first-child {
            border-bottom: 2px solid #334155;
            padding: 0 0.25rem 0.25rem 0.25rem;
            width: 100%;
            text-align: center;
        }
        .fraction > span:last-child {
            padding: 0.25rem 0.25rem 0;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-8 px-4">

    <header class="mb-6 text-center w-full max-w-3xl">
        <div class="inline-block bg-slate-200 text-slate-700 text-xs font-bold px-3 py-1 rounded-full mb-2 shadow-sm">
            기하 계산력 강화 프로젝트
        </div>
        <h1 class="text-2xl md:text-3xl font-black text-slate-800 mb-2 tracking-tight">일반형 $\rightarrow$ 표준형 변환 훈련</h1>
        <p class="text-slate-600 text-sm md:text-base font-medium">주어진 이차곡선의 방정식을 완전제곱식으로 정리하여 표준형으로 만드세요.</p>
    </header>

    <main class="w-full max-w-3xl bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
        
        <!-- 탭 메뉴 -->
        <div class="flex border-b border-slate-200 bg-slate-50">
            <button class="tab-btn tab-parabola flex-1 py-4 text-center text-slate-500 hover:bg-slate-100" onclick="setMode('parabola')">포물선</button>
            <button class="tab-btn tab-ellipse flex-1 py-4 text-center text-slate-500 hover:bg-slate-100" onclick="setMode('ellipse')">타원</button>
            <button class="tab-btn tab-hyperbola flex-1 py-4 text-center text-slate-500 hover:bg-slate-100" onclick="setMode('hyperbola')">쌍곡선</button>
        </div>

        <div class="p-6 md:p-8">
            <div class="bg-amber-50 border border-amber-200 text-amber-800 text-xs md:text-sm p-3 rounded-lg mb-6 shadow-sm">
                💡 <strong>입력 가이드:</strong> 식의 구조 $(x - \square)^2$ 에 맞추어 값을 입력하세요.<br>
                예를 들어 식을 정리했을 때 $(x + 2)^2$ 가 나온다면, 빈칸에는 <strong>-2</strong> 를 입력해야 합니다.
            </div>

            <!-- 생성된 일반형 방정식 표시 -->
            <div class="text-center mb-8">
                <div class="text-slate-500 font-bold mb-2 text-sm">주어진 일반형 방정식</div>
                <div id="equation-display" class="math-font text-2xl md:text-3xl font-black text-slate-800 bg-slate-100 py-4 px-6 rounded-xl inline-block border border-slate-200 shadow-inner">
                    <!-- 수식 주입 -->
                </div>
            </div>

            <div class="flex items-center justify-center mb-6">
                <div class="w-10 h-10 rounded-full bg-slate-200 flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3" /></svg>
                </div>
            </div>

            <!-- 표준형 입력 영역 -->
            <div class="text-center mb-8">
                <div class="text-slate-500 font-bold mb-3 text-sm">표준형으로 변환 (빈칸 채우기)</div>
                <div id="input-container" class="flex flex-wrap justify-center items-center gap-2 text-xl md:text-2xl font-bold text-slate-700 math-font bg-white p-6 rounded-xl border-2 border-dashed border-slate-300">
                    <!-- 동적 입력창 주입 -->
                </div>
            </div>

            <!-- 피드백 메시지 -->
            <div id="feedback-msg" class="text-center font-bold text-lg mb-6 h-6"></div>

            <!-- 액션 버튼 -->
            <div class="flex flex-col sm:flex-row gap-3">
                <button onclick="checkAnswers()" class="flex-1 py-3 bg-slate-800 hover:bg-slate-900 text-white font-bold rounded-xl shadow-md transition transform active:scale-95 text-lg">
                    정답 확인하기
                </button>
                <button id="btn-next" onclick="generateProblem()" class="flex-1 py-3 text-white font-bold rounded-xl shadow-md transition transform active:scale-95 text-lg" style="background-color: #3b82f6;">
                    새로운 문제 생성
                </button>
            </div>
        </div>
    </main>

    <script>
        let currentMode = 'parabola';
        let answerData = {};
        let themeColor = '#10b981';

        // 난수 생성
        function getRand(min, max, excludeZero = false) {
            let val = 0;
            while (true) {
                val = Math.floor(Math.random() * (max - min + 1)) + min;
                if (excludeZero && val === 0) continue;
                break;
            }
            return val;
        }

        // 항들의 배열을 받아 다항식 문자열로 변환 (예: [{c:1, v:'x^2'}, {c:-4, v:'x'}])
        function buildPolynomial(terms) {
            let str = '';
            let isFirst = true;
            for (let t of terms) {
                if (t.c === 0) continue;
                
                let cStr = '';
                let absC = Math.abs(t.c);
                
                if (t.v === '') {
                    cStr = absC.toString();
                } else {
                    if (absC === 1) cStr = t.v; // 1x -> x
                    else cStr = absC.toString() + t.v;
                }

                if (isFirst) {
                    str += (t.c < 0 ? '-' : '') + cStr;
                    isFirst = false;
                } else {
                    str += (t.c < 0 ? ' - ' : ' + ') + cStr;
                }
            }
            return str === '' ? '0' : str;
        }

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            const activeTab = document.querySelector(`.tab-${mode}`);
            activeTab.classList.add('active');

            // 테마 색상 설정
            if (mode === 'parabola') themeColor = '#10b981';
            else if (mode === 'ellipse') themeColor = '#3b82f6';
            else if (mode === 'hyperbola') themeColor = '#8b5cf6';

            document.getElementById('btn-next').style.backgroundColor = themeColor;
            
            generateProblem();
        }

        function generateProblem() {
            // 초기화
            document.getElementById('feedback-msg').innerText = '';
            const inputContainer = document.getElementById('input-container');
            inputContainer.innerHTML = '';
            answerData = {};

            let equationStr = '';

            if (currentMode === 'parabola') {
                // p: 초점거리, m,n: 이동량
                let p = getRand(-4, 4, true); 
                let m = getRand(-5, 5);
                let n = getRand(-5, 5);
                let isY2 = Math.random() > 0.5; // y^2 = 4px 꼴 여부

                if (isY2) {
                    // (y-n)^2 = 4p(x-m) => y^2 - 2ny + n^2 = 4px - 4pm => y^2 - 4px - 2ny + (n^2 + 4pm) = 0
                    let terms = [
                        {c: 1, v: 'y²'},
                        {c: -4*p, v: 'x'},
                        {c: -2*n, v: 'y'},
                        {c: (n*n + 4*p*m), v: ''}
                    ];
                    equationStr = buildPolynomial(terms) + ' = 0';
                    
                    inputContainer.innerHTML = `
                        <span>(</span>
                        <span class="mx-1">y - </span>
                        <input type="number" id="ans_n" class="input-box">
                        <span>)²</span>
                        <span class="mx-3">=</span>
                        <input type="number" id="ans_4p" class="input-box" style="width:70px;">
                        <span class="ml-2">(</span>
                        <span class="mx-1">x - </span>
                        <input type="number" id="ans_m" class="input-box">
                        <span>)</span>
                    `;
                    answerData = { ans_n: n, ans_4p: 4*p, ans_m: m };
                } else {
                    // (x-m)^2 = 4p(y-n) => x^2 - 2mx - 4py + (m^2 + 4pn) = 0
                    let terms = [
                        {c: 1, v: 'x²'},
                        {c: -2*m, v: 'x'},
                        {c: -4*p, v: 'y'},
                        {c: (m*m + 4*p*n), v: ''}
                    ];
                    equationStr = buildPolynomial(terms) + ' = 0';
                    
                    inputContainer.innerHTML = `
                        <span>(</span>
                        <span class="mx-1">x - </span>
                        <input type="number" id="ans_m" class="input-box">
                        <span>)²</span>
                        <span class="mx-3">=</span>
                        <input type="number" id="ans_4p" class="input-box" style="width:70px;">
                        <span class="ml-2">(</span>
                        <span class="mx-1">y - </span>
                        <input type="number" id="ans_n" class="input-box">
                        <span>)</span>
                    `;
                    answerData = { ans_m: m, ans_4p: 4*p, ans_n: n };
                }
            } 
            else if (currentMode === 'ellipse') {
                // (x-m)^2/A + (y-n)^2/B = 1 (A=a^2, B=b^2)
                let a = getRand(2, 5);
                let b = getRand(2, 5);
                while(a === b) { b = getRand(2, 5); } // 원 방지
                let A = a*a; let B = b*b;
                let m = getRand(-4, 4);
                let n = getRand(-4, 4);

                // 일반형: Bx^2 + Ay^2 - 2Bmx - 2Any + (Bm^2 + An^2 - AB) = 0
                let terms = [
                    {c: B, v: 'x²'},
                    {c: A, v: 'y²'},
                    {c: -2*B*m, v: 'x'},
                    {c: -2*A*n, v: 'y'},
                    {c: (B*m*m + A*n*n - A*B), v: ''}
                ];
                equationStr = buildPolynomial(terms) + ' = 0';

                inputContainer.innerHTML = `
                    <div class="fraction">
                        <span>( x - <input type="number" id="ans_m" class="input-box mb-1"> )²</span>
                        <span><input type="number" id="ans_A" class="input-box mt-1"></span>
                    </div>
                    <span class="mx-2">+</span>
                    <div class="fraction">
                        <span>( y - <input type="number" id="ans_n" class="input-box mb-1"> )²</span>
                        <span><input type="number" id="ans_B" class="input-box mt-1"></span>
                    </div>
                    <span class="ml-3">= 1</span>
                `;
                answerData = { ans_m: m, ans_A: A, ans_n: n, ans_B: B };
            } 
            else if (currentMode === 'hyperbola') {
                // (x-m)^2/A - (y-n)^2/B = rhs (+1 or -1)
                let a = getRand(2, 5);
                let b = getRand(2, 5);
                let A = a*a; let B = b*b;
                let m = getRand(-4, 4);
                let n = getRand(-4, 4);
                let isRight = Math.random() > 0.5; // true: =1, false: =-1
                let rhs = isRight ? 1 : -1;

                let terms = [];
                if (isRight) {
                    // Bx^2 - Ay^2 - 2Bmx + 2Any + (Bm^2 - An^2 - AB) = 0
                    terms = [
                        {c: B, v: 'x²'},
                        {c: -A, v: 'y²'},
                        {c: -2*B*m, v: 'x'},
                        {c: 2*A*n, v: 'y'},
                        {c: (B*m*m - A*n*n - A*B), v: ''}
                    ];
                } else {
                    // Bx^2 - Ay^2 - 2Bmx + 2Any + (Bm^2 - An^2 + AB) = 0
                    // 보통 양수항을 먼저 쓰도록 순서 정렬 (y^2 앞이 양수이도록 전체에 -1 곱하기)
                    // -Bx^2 + Ay^2 + 2Bmx - 2Any - (Bm^2 - An^2 + AB) = 0
                    terms = [
                        {c: -B, v: 'x²'},
                        {c: A, v: 'y²'},
                        {c: 2*B*m, v: 'x'},
                        {c: -2*A*n, v: 'y'},
                        {c: -(B*m*m - A*n*n + A*B), v: ''}
                    ];
                }
                equationStr = buildPolynomial(terms) + ' = 0';

                inputContainer.innerHTML = `
                    <div class="fraction">
                        <span>( x - <input type="number" id="ans_m" class="input-box mb-1"> )²</span>
                        <span><input type="number" id="ans_A" class="input-box mt-1"></span>
                    </div>
                    <span class="mx-2">-</span>
                    <div class="fraction">
                        <span>( y - <input type="number" id="ans_n" class="input-box mb-1"> )²</span>
                        <span><input type="number" id="ans_B" class="input-box mt-1"></span>
                    </div>
                    <span class="ml-2">=</span>
                    <input type="number" id="ans_rhs" class="input-box ml-2" style="width: 50px;">
                `;
                answerData = { ans_m: m, ans_A: A, ans_n: n, ans_B: B, ans_rhs: rhs };
            }

            document.getElementById('equation-display').innerHTML = equationStr;
            
            // 입력창 엔터키 이벤트 추가 (다음 칸으로 이동 또는 제출)
            const inputs = document.querySelectorAll('.input-box');
            inputs.forEach((input, index) => {
                input.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        if (index < inputs.length - 1) inputs[index + 1].focus();
                        else checkAnswers();
                    }
                });
            });
        }

        function checkAnswers() {
            let allCorrect = true;

            for (let key in answerData) {
                let inputEl = document.getElementById(key);
                if (!inputEl) continue;

                let userVal = parseInt(inputEl.value);
                let correctVal = answerData[key];

                // 초기화
                inputEl.classList.remove('correct', 'wrong');

                if (isNaN(userVal) || userVal !== correctVal) {
                    inputEl.value = correctVal; // 빈칸이거나 오답인 경우 정답 표시
                    inputEl.classList.add('wrong');
                    allCorrect = false;
                } else {
                    inputEl.classList.add('correct');
                }
            }

            const msgEl = document.getElementById('feedback-msg');
            if (allCorrect) {
                msgEl.innerHTML = `<span style="color: ${themeColor};">🎉 완벽합니다! 완전제곱식으로 정확히 정리했습니다.</span>`;
            } else {
                msgEl.innerHTML = `<span style="color: #dc2626;">💡 빈칸 및 오답 위치에 올바른 정답이 표시되었습니다. 부호와 계산을 다시 확인해 보세요.</span>`;
            }
        }

        // 초기 시작
        window.onload = function() {
            setMode('parabola');
        };
    </script>
</body>
</html>
